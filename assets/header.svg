  <text x="354" y="259" fill="#C9D1D9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="4">SYSTEMS  •  AUTOMATION  •  SOFTWARE</text>
  <path d="M354 280H820" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
