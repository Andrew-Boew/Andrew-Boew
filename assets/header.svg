      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(170 60) rotate(32) scale(350 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientTransform="translate(1070 265) rotate(-150) scale(390 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#8B949E" stroke-opacity="0.075"/>
    </pattern>
  </defs>

  <rect width="1200" height="310" rx="26" fill="url(#background)"/>
  <rect width="1200" height="310" rx="26" fill="url(#glowBlue)"/>
  <rect width="1200" height="310" rx="26" fill="url(#glowPurple)"/>
  <rect x="1" y="1" width="1198" height="308" rx="25" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="308" rx="25" fill="url(#grid)"/>

  <g opacity="0.95">
    <circle cx="53" cy="42" r="6" fill="#FF7B72"/>
    <circle cx="75" cy="42" r="6" fill="#D29922"/>
    <circle cx="97" cy="42" r="6" fill="#3FB950"/>
    <path d="M1110 42H1150" stroke="#8B949E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <text x="50" y="92" fill="#8B949E">01</text>
    <text x="50" y="120" fill="#8B949E">02</text>
    <text x="50" y="148" fill="#8B949E">03</text>
    <text x="92" y="92" fill="#58A6FF">const</text>
    <text x="145" y="92" fill="#C9D1D9">focus</text>
    <text x="190" y="92" fill="#FF7B72">=</text>
