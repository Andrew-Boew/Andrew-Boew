<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andrew Boew</title>
  <desc id="desc">Systems, automation and software engineering</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="10" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="354" y1="280" x2="820" y2="280" gradientUnits="userSpaceOnUse">
